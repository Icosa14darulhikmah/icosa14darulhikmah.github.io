<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICOSA 14 - The First Wings</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts & Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- OVERLAY WELCOME / START SCREEN -->
    <div id="start-screen" class="start-screen">
        <p class="start-text">What's this? you might want to click your screen to find out.</p>
    </div>

    <div class="grid-bg"></div>
    <div class="glow-overlay"></div>

    <!-- MAIN CONTENT (HIDDEN INITIALLY) -->
    <div id="main-content" class="container hidden">
        <h2 class="coming-soon">COMING SOON</h2>
        
        <!-- TEKS GLITCH NEON ICOSA 14 -->
        <h1 class="event-title glitch" data-text="ICOSA 14">ICOSA 14</h1>
        
        <p class="event-theme">"The First Wings"</p>

        <div class="countdown-container">
            <div class="time-box">
                <span id="days" class="number">00</span>
                <span class="label">HARI</span>
            </div>
            <div class="time-box">
                <span id="hours" class="number">00</span>
                <span class="label">JAM</span>
            </div>
            <div class="time-box">
                <span id="minutes" class="number">00</span>
                <span class="label">MENIT</span>
            </div>
            <div class="time-box">
                <span id="seconds" class="number">00</span>
                <span class="label">DETIK</span>
            </div>
        </div>

        <div class="button-group">
            <a href="https://www.instagram.com/hsn_said2410/" target="_blank" rel="noopener noreferrer" class="btn btn-instagram">
                <i class="fa-brands fa-instagram"></i> Our Instagram
            </a>
            <a href="https://www.instagram.com/hsn_said2410/" target="_blank" rel="noopener noreferrer" class="btn btn-register">
                Daftarkan Dirimu!
            </a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
