</head>
<body class="sky-day">
    <!-- OVERLAY WELCOME / START SCREEN -->
    <div id="start-screen" class="start-screen" role="button" tabindex="0">
        <p class="start-text">What's this? you might want to click your screen to find out.</p>
    </div>

    <!-- ADAPTIVE SKY BACKGROUND & CELESTIAL ELEMENTS -->
    <div class="sky-background">
        <div class="sun"></div>
        <div class="moon"></div>
        <div id="stars-container" class="stars-container"></div>
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
        <div class="cloud cloud-3"></div>
    </div>

    <!-- MAIN CONTENT -->
    <div id="main-content" class="container hidden">
        <p class="coming-soon" id="comingSoon">COMING SOON</p>
        
        <!-- TITLE CLEAR FROM GLITCH -->
        <h1 class="event-title">ICOSA 14</h1>
        
        <p class="event-theme">"The First Wings"</p>
        <p class="event-date"><i class="fa-regular fa-calendar-days"></i> 16 Desember 2026</p>

        <div class="countdown-container">
            <div class="time-box">
                <span id="days" class="number">00</span>
                <span class="label">DAYS</span>
            </div>
            <div class="time-box">
                <span id="hours" class="number">00</span>
                <span class="label">HOURS</span>
            </div>
            <div class="time-box">
                <span id="minutes" class="number">00</span>
                <span class="label">MINUTES</span>
            </div>
            <div class="time-box">
                <span id="seconds" class="number">00</span>
                <span class="label">SECONDS</span>
            </div>
        </div>

        <div class="button-group">
            <a href="https://www.instagram.com/official_icosa/" target="_blank" rel="noopener noreferrer" class="btn btn-instagram">
                <i class="fa-brands fa-instagram"></i> Our Instagram
            </a>
            <button type="button" id="openBtn" class="btn btn-instagram">
                <i class="fa-regular fa-images"></i> What's on the list?
            </button>
            <a href="https://drive.google.com/drive/folders/1udfW22t-Zg9W061fVxP0Ceko4svVpTsV?usp=drive_link" target="_blank" rel="noopener noreferrer" class="btn btn-instagram">
                <i class="fa-solid fa-file-arrow-down"></i> Download Juklak Juknis Lomba
            </a>
            <a href="https://icosa14darulhikmah.cyou/pendaftaran" target="_blank" rel="noopener noreferrer" class="btn btn-instagram">
                <i class="fa-solid fa-pen"></i> Register Now
            </a>
        </div>
    </div>

    <!-- HIGHLIGHT STORY VIEWER -->
  <div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Highlight Me" aria-hidden="true">
    <div class="viewer-bg" id="viewerBg"></div>

    <button class="nav nav-prev" id="navPrev" type="button" aria-label="Sebelumnya">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>

    <div class="story" id="story" tabindex="-1">
      <div class="story-media" id="media">
        <img class="story-bg" id="storyBg" alt="" draggable="false">
        <img class="story-img" id="storyImg" alt="" draggable="false">
      </div>

      <div class="story-error" id="storyError" hidden></div>

      <div class="shade-top"></div>

      <div class="ui">
        <div class="bars" id="bars"></div>
        <header class="story-header">
          <img class="avatar" id="avatar" src="p.png" alt="" draggable="false">
          <span class="title">Competitions List</span>
          <div class="actions">
            <button id="pauseBtn" type="button" aria-label="Pause"></button>
            <button id="closeBtn" type="button" aria-label="Tutup">
              <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
            </button>
          </div>
        </header>
      </div>

      <div class="zone zone-prev" id="zonePrev"></div>
      <div class="zone zone-next" id="zoneNext"></div>
    </div>

    <button class="nav nav-next" id="navNext" type="button" aria-label="Berikutnya">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>



    <script src="script.js"></script>
